name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Determine base href
        id: base
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY%%/*}"

          if [ "$REPO_NAME" = "${OWNER_NAME}.github.io" ]; then
            echo "base_href=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_href=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href "${{ steps.base.outputs.base_href }}"

      - name: Verify Flutter Web build
        shell: bash
        run: |
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          echo "Flutter Web build verified successfully."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
